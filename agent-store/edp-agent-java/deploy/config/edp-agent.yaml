schema: ascend-agent/v1
name: edp-agent
description: EDP 动态规划智能体（Docker 部署版）

framework:
  type: openjiuwen
  agent: deepagent
  options:
    maxIterations: 100
    enableTaskLoop: true

model:
  provider: OpenAI
  name: deepseek-v4-pro
  baseUrl: https://api.deepseek.com/v1
  apiKey: PLACEHOLDER_USE_ENV_VAR

versatile:
  # 直连 Versatile 时使用；可选通过 EDP_AGENT_VERSATILE_URL 环境变量覆盖
  url: http://host.docker.internal:30001/v1/0/agent-manager/workflows/{workflow_id}/conversations/{conversation_id}
  # 必须指向 adapter 容器服务名（Compose 内互访），不能用 localhost
  adapter_a2a_url: http://adapter-versatile:8191/a2a
  timeout: 30s
  url_variables:
    workflow_id: mock_workflow
  query_params:
    type: controller
    workspace_id: "10"
  headers:
    content-type: application/json
    stream: "true"

prompt:
  system: ""

skills:
  directories: []
  mode: all

tools:
  - bash
  - skill_tool
  - call_versatile
  - call_mcp
  - ask_user
  - lite_todo_write
  - cancel_task
