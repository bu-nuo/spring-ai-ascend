schema: ascend-agent/v1
name: edp-agent
description: EDP 动态规划智能体

#framework:
  #type: openjiuwen
  #agent: deepagent
  # options 配置已迁移到 governance/actrule.yaml
  # maxIterations → actrule.max_steps
  # enableTaskLoop → actrule.enable_task_loop
  # options:
  #   maxIterations: 100
  #   enableTaskLoop: true

model:
  provider: OpenAI
  name: deepseek-v4-pro
  baseUrl: https://api.deepseek.com/v1
  apiKey: PLACEHOLDER_USE_ENV_VAR

versatile:
  url: http://localhost:30001/v1/0/agent-manager/workflows/{workflow_id}/conversations/{conversation_id}
  # adapter_a2a_url: http://localhost:8191/a2a  # 未启动 adapter 服务时注释掉，走 REST 直连 mock
  timeout: 30s
  url_variables:
    workflow_id: mock_workflow
  query_params:
    type: controller
    workspace_id: "10"
  headers:
    content-type: application/json
    stream: "true"

#prompt:
  # system 从未被使用，系统提示词由 planrule.yaml + 场景配置动态拼接
  # system: ""

# Skill 目录不再在 YAML 中硬编码（方案 B）。
# 业务 Skill 从 scenarioHome/skills/ 动态加载，由 Spring Boot @Value 注入路径。
# skills.mode 已迁移到 governance/actrule.yaml 的 skill_mode 字段。
# skills:
#   directories: []  # 已废弃，直接删除
#   mode: all        # → actrule.skill_mode

# tools 已迁移到 governance/actrule.yaml 的 allowed_tools 字段（叠加合并）。
# tools:
#   - bash
#   - skill_tool
#   - call_versatile
#   - call_mcp
#   - ask_user
