schema: ascend-agent/v1
name: edp-agent
description: EDP 动态规划智能体

framework:
  type: openjiuwen
  agent: deepagent
  options:
    maxIterations: 100
    enableTaskLoop: true

model:
  provider: OpenAI
  name: MiniMax-M2.7
  baseUrl: https://api.minimax.chat/v1
  apiKey: PLACEHOLDER_USE_ENV_VAR

versatile:
  url: http://localhost:30001/v1/0/agent-manager/workflows/{workflow_id}/conversations/{conversation_id}
  # adapter_a2a_url: http://localhost:8191/a2a  # 未启动 adapter 服务时注释掉，走 REST 直连 mock
  timeout: 30s
  url_variables:
    workflow_id: mock_workflow
  query_params:
    type: controller
    workspace_id: "10"
  headers:
    content-type: application/json
    stream: "true"

prompt:
  system: ""

# Skill 目录不再在 YAML 中硬编码（方案 B）。
# 业务 Skill 从 scenarioHome/skills/ 动态加载，由 Spring Boot @Value 注入路径。
# skills.directories 保留为空列表，仅声明 mode。
skills:
  directories: []
  mode: all

tools:
  - bash
  - skill_tool
  - call_versatile
  - call_mcp
  - ask_user
  - todo_create
  - todo_modify
  - todo_list
  - todo_get
  - cancel_task
