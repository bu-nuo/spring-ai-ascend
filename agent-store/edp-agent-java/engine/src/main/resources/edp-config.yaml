# edp-config.yaml（框架级配置，替代 AgentRule.md）

scope:
  allowed: ""
  out_of_scope_message: "当前请求暂不在可处理范围内。"

# ── 场景发现配置（方案 B：路径由 scenarioHome 属性注入）──
# base_path 和 active_scenario 仅作回退逻辑使用。
# 正常情况下场景路径由 Spring Boot @Value 注入的 edpa.agent.scenario-home 确定。
scenario_discovery:
  base_path: "scenarios"
  active_scenario: "wealth-demo"

planning_steps:
  - 需求解析：识别用户意图与关键参数
  - 目标拆解：列出待执行的子任务
  - 方案生成：确定每个子任务的工具与入参
  - 规则校验：检查是否超出业务范围
  - 结果输出：总结并返回用户

# todolist 占位（真实步骤由场景文件 scenario-config.yaml 提供）
todolist_steps:
  - step_id: 1
    content: "占位步骤（请配置 scenarioHome 或检查场景文件）"
    skill: "_placeholder_"

limits:
  tasks:
    call_versatile: 100
    call_mcp: 100
    ask_user: 100
    execute_cmd: 100

summary:
  format: "需求概述→规划过程→任务执行情况→结果汇总→异常说明"
  max_length: 500
  required_fields:
    - 用户查询
    - 执行步骤
    - 结果状态

utterances:
  config_path: "./SysScriptsConfig.yaml"

think_chunk:
  mode: fixed_script
  chars_per_frame: 4
  tokens_between_frames: 2
  min_interval_ms: 50
  default_scripts:
    - "正在处理您的请求..."
  query_patterns: []
