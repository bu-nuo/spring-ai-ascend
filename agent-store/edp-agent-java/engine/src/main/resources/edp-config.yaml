# edp-config.yaml（框架级配置，替代 AgentRule.md）

scope:
  allowed: ""
  out_of_scope_message: "当前请求暂不在可处理范围内。"

summary:
  format: "需求概述→规划过程→任务执行情况→结果汇总→异常说明"
  max_length: 500
  required_fields:
    - 用户查询
    - 执行步骤
    - 结果状态

utterances:
  config_path: "./SysScriptsConfig.yaml"

think_chunk:
  mode: fixed_script
  chars_per_frame: 4
  tokens_between_frames: 2
  min_interval_ms: 50
  default_scripts:
    - "正在处理您的请求..."
  query_patterns: []
