# actrule.yaml — 场景 governance 可配置字段参考
#
# 定位：定义 Agent 的任务执行约束与行为边界
#
# 符号约定：
#   @用途      = 字段含义
#   @策略      = 替代式覆盖 | 继承式覆盖 | 叠加合并 | 框架保护
#               替代式覆盖：场景有值则完全替换框架值
#               继承式覆盖：场景有值则覆盖，无值则继承框架
#               叠加合并：场景值追加到框架值末尾（去重）
#   @类型      = string | integer | boolean | list | map | object
#   @约束      = 合法取值范围
#   @默认      = 框架默认值
#   @场景可配  = 是 | 否
#
# 使用方式：复制需要的行到你的 scenarios/{场景名}/governance/actrule.yaml，
#          删掉不需要的字段即可，未配置的字段自动继承框架默认值。

actrule:
  # ============================================================
  # 执行边界控制
  # ============================================================

  # @用途: 单次任务执行最大步数
  # @策略: 继承式覆盖
  # @类型: integer
  # @约束: ≥1
  # @默认: 100
  # @场景可配: 是
  max_steps: 100

  # @用途: 是否启用任务循环（多轮规划-执行）
  # @策略: 继承式覆盖
  # @类型: boolean
  # @约束: true | false
  # @默认: true
  # @场景可配: 是
  enable_task_loop: true

  # @用途: 单层最大子任务数量
  # @策略: 继承式覆盖
  # @类型: integer
  # @约束: ≥1
  # @默认: 50
  # @场景可配: 是
  max_subtasks: 50

  # ============================================================
  # 重试与重规划
  # ============================================================

  # @用途: 是否允许失败后重新规划
  # @策略: 继承式覆盖
  # @类型: boolean
  # @约束: true | false
  # @默认: true
  # @场景可配: 是
  replan_enabled: true

  # @用途: 最大重规划次数
  # @策略: 继承式覆盖
  # @类型: integer
  # @约束: ≥0
  # @默认: 3
  # @场景可配: 是
  max_replan_count: 3

  # @用途: 是否允许失败重试
  # @策略: 继承式覆盖
  # @类型: boolean
  # @约束: true | false
  # @默认: true
  # @场景可配: 是
  retry_enabled: true

  # @用途: 最大重试次数
  # @策略: 继承式覆盖
  # @类型: integer
  # @约束: ≥0
  # @默认: 3
  # @场景可配: 是
  max_retry_count: 3

  # ============================================================
  # Skill 加载模式
  # ============================================================

  # @用途: Skill 加载策略
  # @策略: 继承式覆盖
  # @类型: string
  # @约束: "all"（列出所有 Skill）| "auto_list"（动态搜索）| "none"（关闭 Skill 系统）
  # @默认: all
  # @场景可配: 是
  skill_mode: all

  # ============================================================
  # 工具控制
  # ============================================================

  # @用途: 允许调用的工具列表
  # @策略: 叠加合并（场景工具追加到框架工具末尾，去重）
  # @类型: list[string]
  # @约束: 每个值为合法工具名
  # @默认: [bash, skill_tool, call_versatile, call_mcp, ask_user, todo_create, todo_modify, todo_list, todo_get, cancel_task]
  # @场景可配: 是
  allowed_tools:
    - bash
    - skill_tool
    - call_versatile
    - call_mcp
    - ask_user
    - todo_create
    - todo_modify
    - todo_list
    - todo_get
    - cancel_task

  # @用途: 单个工具调用次数上限
  # @策略: 继承式覆盖
  # @类型: map[string, integer]
  # @约束: key 为工具名，value 为上限值（≥0）
  # @默认: call_versatile=100, call_mcp=100, ask_user=100, execute_cmd=100
  # @场景可配: 是
  tool_limits:
    call_versatile: 100
    call_mcp: 100
    ask_user: 100
    execute_cmd: 100

  # ============================================================
  # 任务定义（todolist）
  # ============================================================

  # @用途: 任务定义列表，定义场景的标准任务流程（catalog_id → 内容/描述/依赖/Skill 映射）
  #   由 EdpaTodoRail 运行时注入提示词并做依赖闭环校验
  # @策略: 替代式覆盖（场景提供完整定义，框架默认无值）
  # @类型: list[TodolistEntry]
  # @约束: catalog_id 唯一；depends_on 引用必须存在于 entries 中；依赖图无环
  # @默认: （框架无值）
  # @场景可配: 是
  todolist_entries: （仅场景级配置，框架默认无此字段）
  #   - catalog_id: product_recommend          # 必填，字符串，任务主键
  #     content: "推荐理财产品"                 # 必填，任务名称（注入提示词）
  #     description: "根据用户需求推荐合适的理财产品"  # 可选，任务描述（注入提示词）
  #     depends_on: []                         # 可选，前置依赖的 catalog_id 列表
  #     skill: "product_recommend_skill"        # 可选，关联的 Skill 名称

  # @用途: 动态路径规则列表，定义运行时任务跳过/重定向逻辑
  #   由 EdpaTodoRail 注入提示词 "**动态路径规则**："
  # @策略: 替代式覆盖（场景提供完整定义，框架默认无值）
  # @类型: list[TodolistPath]
  # @约束: skip_steps 引用必须存在于 todolist_entries 的 catalog_id 中
  # @默认: （框架无值）
  # @场景可配: 是
  todolist_dynamic_paths: （仅场景级配置，框架默认无此字段）
  #   - path_id: shortcut_skip_filter          # 必填，路径标识
  #     description: "用户首次推荐即明确选择，跳过交互式筛选"  # 必填，规则说明
  #     trigger: "product_recommend 返回结果中用户已明确选择某个产品"  # 必填，触发条件
  #     skip_steps:                            # 必填，需要跳过的 catalog_id 列表
  #       - interact_finance_rec
  #     redirect: "product_recommend → product_select"  # 必填，重定向说明
