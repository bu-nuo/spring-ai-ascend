# planrule.yaml — 场景 governance 可配置字段参考
#
# 定位：定义 Agent 的角色定位、职责边界、场景上下文和行为约束
#
# 符号约定：
#   @用途      = 字段含义
#   @策略      = 替代式覆盖 | 继承式覆盖 | 叠加合并 | 框架保护
#               替代式覆盖：场景有值则完全替换框架值
#               继承式覆盖：场景有值则覆盖，无值则继承框架
#   @类型      = string | integer | boolean | list
#   @约束      = 合法取值范围
#   @默认      = 框架默认值
#   @场景可配  = 是 | 否
#
# 使用方式：复制需要的行到你的 scenarios/{场景名}/governance/planrule.yaml，
#          删掉不需要的字段即可，未配置的字段自动继承框架默认值。

planrule:
  # ============================================================
  # Agent 身份定义
  # ============================================================

  # @用途: Agent 角色定位，注入系统提示词作为一级标题
  # @策略: 继承式覆盖
  # @类型: string
  # @约束: 任意字符串
  # @默认: "你的身份是通用动态规划智能体"
  role: "你的身份是通用动态规划智能体"

  # @用途: Agent 职责描述，紧跟角色之后
  # @策略: 继承式覆盖
  # @类型: string
  # @约束: 任意字符串
  # @默认: 见 framework governance/planrule.yaml
  description: "你的核心职责是负责任务规划、执行和结果总结。无论当前场景是什么，你的身份始终是通用动态规划智能体，场景只是你需要处理的具体业务上下文。自我介绍时，必须说「你好，我是通用动态规划智能体」，严禁根据场景自称特定业务助手（如理财助手、客服助手等）。"

  # ============================================================
  # 场景上下文（仅场景级配置，框架默认无值）
  # ============================================================

  # @用途: 场景名称，注入系统提示词 "**当前场景**：{值}"
  # @策略: 继承式覆盖
  # @类型: string
  # @约束: 任意字符串，建议简短（≤20 字符）
  # @默认: （框架无值，非场景模式不注入此行）
  scenario_name: （仅场景级配置，框架默认无此字段）

  # @用途: 场景业务描述，紧跟场景名称之后
  # @策略: 继承式覆盖
  # @类型: string
  # @约束: 任意字符串，建议 1-2 句
  # @默认: （框架无值，非场景模式不注入此行）
  scenario_description: （仅场景级配置，框架默认无此字段）

  # ============================================================
  # 业务范围边界
  # ============================================================

  # @用途: Agent 职责边界（允许/禁止的业务范围、超范围提示语）
  # @策略: 替代式覆盖（配置则完全替换框架值）
  # @类型: object
  scope:
    # @用途: 允许的业务范围，注入 "**当前支持的业务**：{值}"
    # @策略: 替代式覆盖
    # @类型: string（顿号分隔，如 "业务A、业务B"）
    # @约束: 任意字符串；="" 表示无限制；=" " 表示跳过注入
    # @默认: ""
    allowed: ""

    # @用途: 禁止的业务范围，注入 "**禁止的业务**：{值}"
    # @策略: 替代式覆盖
    # @类型: string（顿号分隔）
    # @约束: 任意字符串；="" 表示无禁止项；=" " 表示跳过注入
    # @默认: ""
    denied: ""

    # @用途: 用户请求超出业务范围时的提示消息
    # @策略: 替代式覆盖
    # @类型: string
    # @约束: 任意字符串
    # @默认: "当前请求暂不在可处理范围内。"
    out_of_scope_message: "当前请求暂不在可处理范围内。"

  # ============================================================
  # Skill路由规则
  # ============================================================

  # @用途: Skill路由规则列表，注入系统提示词 "**Skill 路由**："
  # @策略: 继承式覆盖
  # @类型: list[SkillRoute]
  # @约束: 每项含 trigger(触发条件)、skill(目标skill名称)、priority(优先级，越小越优先)
  # @默认: （框架无值，非场景模式不注入）
  # @场景可配: 是
  skill_routing: （仅场景级配置，框架默认无此字段）

  # ============================================================
  # 补充提示词（行为约束规则）
  # ============================================================

  # @用途: 补充提示词（ReAct 循环协议、工具调用规约、行为约束等），直接注入系统提示词末尾
  # @策略: 替代式覆盖
  # @类型: string（支持多行）
  # @约束: 任意字符串
  # @默认: 见 framework governance/planrule.yaml（约 62 行 ReAct 协议）
  supplementary_prompt: |
    你采用「规划—执行—观察—反思」ReAct 循环处理用户请求。
    （详见 framework governance/planrule.yaml 完整内容）
