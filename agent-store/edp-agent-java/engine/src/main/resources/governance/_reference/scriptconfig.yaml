# ============================================================================
# scriptconfig.yaml 参考文件 — 场景开发者权威参考
# ============================================================================
# 本文件列出 scriptconfig.yaml 的全部可配置字段及其约束说明。
# 这是全量模板，场景开发者只写差异字段。
# 未在此处分组的字段（如 scriptconfig.general_scripts）属于实验性功能，不在稳定参考范围内。
# ============================================================================

scriptconfig:
  # ============================================================================
  # 思考分片话术（think_chunk_scripts）
  # ============================================================================
  think_chunk_scripts:
    # @用途: 控制 thinking 阶段的话术分片推送模式
    # @策略: 继承式覆盖（场景覆盖框架默认值）
    # @默认: think_chunk（框架默认模式）
    # @可选: think_chunk | 未来可扩展
    think_chunk_mode: think_chunk

    # ========================================================================
    # 固定话术帧（think_chunk_fixed_scripts）
    # ========================================================================
    # @用途: 在 thinking 阶段按帧推送固定话术，用于等待/加载场景
    # @策略: 继承式覆盖（帧参数字段级合并）
    # ========================================================================
    think_chunk_fixed_scripts:
      # @用途: 是否启用固定话术帧
      # @类型: boolean
      # @默认: true
      enabled: true

      # @用途: 每帧显示字符数
      # @类型: int
      # @默认: 20
      chars_per_frame: 20

      # @用途: 帧间思考 token 数（控制话术更新间隔）
      # @类型: int
      # @默认: 10
      tokens_between_frames: 10

      # @用途: 帧间最小间隔毫秒
      # @类型: int
      # @默认: 100
      min_interval_ms: 100

      # ── planning 阶段话术（第1轮思考）──────────────────────────────
      # @用途: 默认话术（query_patterns 全未命中时的降级话术）
      # @策略: 继承式覆盖
      # @类型: list[string]
      # @默认: ["正在分析您的需求..."]
      # @场景可配: 是
      default_scripts:
        - "正在分析您的需求..."

      # @用途: 按用户 query 关键词匹配的话术组（planning 阶段，继承式覆盖）
      # @策略: 继承式覆盖
      # @类型: list[QueryPattern]
      # @匹配逻趣: 按声明顺序遍历，首个关键词命中即生效；全未命中降级到 default_scripts
      # @默认: []（无匹配规则，始终走降级话术）
      # @场景可配: 是
      # @示例（场景可配时写在此处）:
      #   query_patterns:
      #     - keywords: ["推荐", "理财"]
      #       scripts:
      #         - "正在搜索理财产品..."
      #     - keywords: ["购买", "买"]
      #       scripts:
      #         - "正在确认购买信息..."
      query_patterns: []

      # ── executing 阶段话术（第2轮及后续思考轮次）────────────────────
      # @用途: executing 阶段的默认话术
      # @策略: 继承式覆盖
      # @类型: list[string]
      # @默认: 见框架脚本配置
      # @场景可配: 是
      execution_scripts:
        - "正在处理您的请求..."
        - "正在执行工具调用，请稍等..."

      # ── 恢复话术（resume）────────────────────────────────────────────
      # @用途: 中断恢复时的话术
      # @策略: 继承式覆盖
      # @类型: list[string]
      # @默认: 见框架脚本配置
      # @场景可配: 是
      resume_scripts:
        - "收到您的回复，继续为您服务..."
