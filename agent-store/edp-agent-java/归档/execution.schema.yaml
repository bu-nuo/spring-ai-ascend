# Execution Schema Definition
#
# 定位：执行域Schema，定义Agent的任务执行约束、工具约束和Skill映射
#
# 作用：
# - 回答Agent如何执行任务
# - 回答Agent如何使用工具
# - 回答Agent如何控制资源消耗
#
# 继承覆盖规则：
# - max_steps：继承式覆盖（只写差异）
# - max_execution_time：继承式覆盖（只写差异）
# - max_concurrency：继承式覆盖（只写差异）
# - allowed_tools：继承式覆盖（只写差异）
# - blocked_tools：继承式覆盖（只写差异）
# - skill_mapping：替代式覆盖（完全覆盖）
# - retry_enabled：继承式覆盖（只写差异）
# - max_retry_count：继承式覆盖（只写差异）

execution:
  # 限制最大执行步数
  max_steps:
    type: integer
    description: |
      限制最大执行步数
      
      执行步数是指Agent执行任务时调用工具、规划、执行的总次数
      限制执行步数可以避免任务执行过长，提高执行效率
    example: 100
    range:
      min: 1
      max: 1000
      default: 100
      recommended: 50-200
    inheritance: inheritable

  # 限制任务最长运行时间
  max_execution_time:
    type: integer
    unit: seconds
    description: |
      限制任务最长运行时间
      
      运行时间是指Agent执行任务的总时长（单位：秒）
      限制运行时间可以避免任务执行过长，提高执行效率
    example: 300
    range:
      min: 60
      max: 3600
      default: 300
      recommended: 180-600
    inheritance: inheritable

  # 限制最大并发任务数
  max_concurrency:
    type: integer
    description: |
      限制最大并发任务数
      
      并发任务数是指Agent同时执行的任务数量
      是否并发由Planner决定，Governance仅限制最大允许并发数
      限制并发数可以避免资源消耗过大，提高执行效率
    example: 5
    range:
      min: 1
      max: 10
      default: 5
      recommended: 3-8
    inheritance: inheritable

  # 允许调用的工具列表
  allowed_tools:
    type: array[string]
    description: |
      允许调用的工具列表
      
      工具是Agent执行任务的能力，如bash、skill_tool、call_versatile等
      定义允许调用的工具列表，可以限制Agent的能力范围
    example:
      - bash
      - skill_tool
      - call_versatile
      - call_mcp
      - ask_user
      - lite_todo_write
      - cancel_task
    inheritance: inheritable

  # 禁止调用的工具列表
  blocked_tools:
    type: array[string]
    description: |
      禁止调用的工具列表
      
      blocked_tools优先级高于allowed_tools
      定义禁止调用的工具列表，可以限制Agent的能力范围
    example:
      - dangerous_tool
    inheritance: inheritable

  # Skill映射表（原todolist_steps）--删除
  skill_mapping:
    type: array[object]
    description: |
      step_id → skill映射表
      
      用于LiteTodoWriteTool的Schema约束和状态管理
      
      step_id：步骤ID，用于lite_todo_write工具的Schema枚举约束
      content：步骤展示内容，用于TodoListItemEvent渲染
      skill：步骤关联技能名，与skills/目录下的SKILL.md name一致
    example:
      - step_id: 1
        content: "推荐理财产品"
        skill: "product_recommend_skill"
      - step_id: 2
        content: "交互式理财筛选"
        skill: "interact_finance_rec_skill"
      - step_id: 3
        content: "确定购买产品和金额"
        skill: "product_select_skill"
      - step_id: 4
        content: "查询理财账户余额，如果资金不足进行资金筹划，并购买理财产品"
        skill: "fund_planning_skill"
    inheritance: replaceable

  # 是否允许失败重试
  retry_enabled:
    type: boolean
    description: |
      是否允许失败重试
      
      当任务执行失败时，Agent可以选择：
      - true：重新执行任务，尝试其他方案
      - false：直接报告失败，不重新执行
      
      建议开启重试，提高任务成功率
    example: true
    range:
      values: [true, false]
      default: true
      recommended: true
    inheritance: inheritable

  # 限制最大重试次数
  max_retry_count:
    type: integer
    description: |
      限制最大重试次数
      
      例如：
      - max_retry_count: 3 表示最多重试3次
      - 如果3次重试都失败，则报告任务失败
      
      限制重试次数可以避免无限重试，节省资源
    example: 3
    range:
      min: 1
      max: 10
      default: 3
      recommended: 2-5
    inheritance: inheritable
