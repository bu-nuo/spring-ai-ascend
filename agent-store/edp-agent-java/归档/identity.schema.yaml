# Identity Schema Definition
#
# 定位：身份域Schema，定义Agent的身份、角色、职责边界和补充提示词
#
# 作用：
# - 回答Agent是谁
# - 回答Agent负责什么
# - 回答Agent边界是什么
#
# 继承覆盖规则：
# - role：继承式覆盖（只写差异）
# - description：继承式覆盖（只写差异）
# - scope.allowed：替代式覆盖（完全覆盖）
# - scope.denied：替代式覆盖（完全覆盖）
# - scope.out_of_scope_message：替代式覆盖（完全覆盖）
# - supplementary_prompt：替代式覆盖（完全覆盖）

identity:
  # Agent角色
  role:
    type: string
    description: 定义Agent角色定位
    example: planner
    inheritance: inheritable

  # Agent描述
  description:
    type: string
    description: 定义Agent角色描述和职责说明
    example: "负责任务规划、执行和结果总结的智能助手"
    inheritance: inheritable

  # Agent职责边界
  scope:
    type: object
    description: 定义Agent允许承担的业务范围、禁止承担的业务范围、超出业务范围时的提示消息

    # 允许的业务范围列表
    allowed:
      type: array[string]
      description: |
        定义Agent允许承担的业务范围
        精确列举每个业务项，便于LLM精确匹配和判断
      example:
        - "余额查询"
        - "转账"
        - "理财推荐"
        - "购买确认"
      inheritance: replaceable

    # 禁止的业务范围列表
    denied:
      type: array[string]
      description: |
        定义Agent禁止承担的业务范围
        明确禁止某些业务，避免LLM误判
        金融场景等敏感场景需要明确禁止某些业务（如基金、股票）
      example:
        - "基金相关业务"
        - "股票相关业务"
      inheritance: replaceable
      optional: true

    # 超出业务范围时的提示消息
    out_of_scope_message:
      type: string
      description: |
        定义超出业务范围时的提示消息
        提供友好的用户体验，避免LLM直接拒绝
      example: "尚在学习中，暂不支持该业务"
      inheritance: replaceable

  # 补充提示词
  supplementary_prompt:
    type: string
    format: markdown
    description: |
      补充提示词，预留灵活的处理方式
      
      例如：智能体行为约束等
    example: |
      ## 行为约束
      
      1. **【最高优先级】** 当用户表达终止意图（如"取消"、"取消购买"、"不买了"、"退出"、"stop"、"cancel"等），立即停止执行
      2. 当用户表达修改意图，暂停当前任务，重新规划
      3. Human-in-the-loop 中断
      
      当遇到以下情况，**调用 `ask_user` 工具**暂停执行，等待用户补充：
      
      - 关键参数缺失（如用户没说转账金额）
      - 敏感操作需用户确认（如购买确认）
      - 用户输入有歧义
      
      `ask_user` 工具输入：
      ```json
      {"question": "请确认购买 <产品名>，金额 <X> 元吗？"}
      ```
      
      用户回复后，你会在 tool_result 中看到用户输入内容。
      【注意】如果关键信息都已具备，你需要和用户再次确认购买信息，当用户返回肯定信息后，**下一步必须是调用对应业务工具（如 step 4 的 `fund_planning_skill` 通过 `call_versatile`）执行真正的下单**——**不要**先把 todo 翻 done，**不要**直接出 `final_answer`。业务工具 `tool_end success=true` 之后再调一次 `lite_todo_write` 翻 done。
    inheritance: replaceable
