# Planning Schema Definition
#
# 定位：规划域Schema，定义Agent的任务规划约束
#
# 作用：
# - 回答Agent如何规划任务
# - 定义任务如何拆解与规划
#
# 继承覆盖规则：
# - max_depth：继承式覆盖（只写差异）
# - max_subtasks：继承式覆盖（只写差异）
# - replan_enabled：继承式覆盖（只写差异）
# - max_replan_count：继承式覆盖（只写差异）

planning:
  # 限制规划深度--删掉
  max_depth:
    type: integer
    description: |
      限制任务规划的最大深度
      
      规划深度是指任务拆解的层级数。例如：
      - 深度1：任务本身（如"购买理财产品")
      - 深度2：子任务（如"查询账户余额"、"选择理财产品")
      - 深度3：子任务的子任务（如"登录银行APP"、"输入密码")
      
      限制规划深度可以避免任务拆解过细，提高执行效率
    example: 3
    range:
      min: 1
      max: 10
      default: 2
      recommended: 3-5
    inheritance: inheritable

  # 限制单层最大子任务数量
  max_subtasks:
    type: integer
    description: |
      限制单个任务拆解出的最大子任务数量
      
      例如：任务"购买理财产品"拆解为：
      - 子任务1：查询账户余额
      - 子任务2：选择理财产品
      - 子任务3：确认购买
      
      限制子任务数量可以避免任务拆解过多，提高规划效率
    example: 5
    range:
      min: 1
      max: 20
      default: 50
      recommended: 3-10
    inheritance: inheritable

  # 允许失败后重新规划
  replan_enabled:
    type: boolean
    description: |
      是否允许任务执行失败后重新规划
      
      当任务执行失败时，Agent可以选择：
      - true：重新规划任务，尝试其他方案
      - false：直接报告失败，不重新规划
      
      建议开启重规划，提高任务成功率
    example: true
    range:
      values: [true, false]
      default: true
      recommended: true
    inheritance: inheritable

  # 限制最大重规划次数
  max_replan_count:
    type: integer
    description: |
      限制任务失败后重新规划的最大次数
      
      例如：
      - max_replan_count: 3 表示最多重新规划3次
      - 如果3次重规划都失败，则报告任务失败
      
      限制重规划次数可以避免无限重试，节省资源
    example: 3
    range:
      min: 1
      max: 10
      default: 3
      recommended: 2-5
    inheritance: inheritable
